<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self Help Page</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }

        img {
            max-width: 100%;
            height: auto;
            margin-bottom: 20px;
        }

        .question {
            font-size: 24px;
            margin: 20px;
            white-space: nowrap;
            overflow: hidden;
            border-right: 4px solid;
            animation: typing 3s steps(30, end), blink-caret 0.75s step-end infinite;
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes blink-caret {
            from, to { border-color: transparent; }
            50% { border-color: black; }
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .btnImprove {
            background-color: #FFD700; /* Golden chrome color */
        }

        .btnGetRidOf {
            background-color: #C0C0C0; /* Silver chrome color */
        }

        @media (max-width: 600px) {
            .question {
                font-size: 20px;
            }

            .btn {
                font-size: 16px;
                padding: 8px 16px;
            }
        }
    </style>
</head>
<body>

    <img src="your-image-url.jpg" alt="Self Help Image">
    <div class="question">Hi, I am Amy. What do you want to "Improve/Get Rid Of"?</div>
    
    <div class="button-container">
        <button class="btn btnImprove">Improve</button>
        <button class="btn btnGetRidOf">Get Rid Of</button>
    </div>

    <script>
        // Optional: Add functionality to buttons  
        document.querySelector('.btnImprove').addEventListener('click', function() {
            alert('You chose to Improve!');
        });

        document.querySelector('.btnGetRidOf').addEventListener('click', function() {
            alert('You chose to Get Rid Of!');
        });
    </script>
</body>
</html>
