<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMY | Achieve Mastering Yourself</title>
    <link rel="stylesheet" href="style.css"> <!-- Link to the external CSS file -->
</head>
<body>

    <img src="amythinks.jpeg" alt="Self Help Image">
    <div class="question">Hi, I am Amy. What do you want to "Improve/Get Rid Of"?</div>
    
    <div class="button-container">
        <button class="btn btnImprove">Improve</button>
        <button class="btn btnGetRidOf">Get Rid Of</button>
    </div>

    <div class="input-container">
        <input type="text" class="input inputImprove" placeholder="What do you want to improve?">
        <input type="text" class="input inputGetRidOf" placeholder="What do you want to get rid of?">
    </div>

    <script>
        const improveButton = document.querySelector('.btnImprove');
        const getRidOfButton = document.querySelector('.btnGetRidOf');
        const inputContainer = document.querySelector('.input-container');
        const inputImprove = document.querySelector('.inputImprove');
        const inputGetRidOf = document.querySelector('.inputGetRidOf');

        improveButton.addEventListener('click', function() {
            inputContainer.style.display = 'block';
            inputImprove.style.display = 'block';
            inputGetRidOf.style.display = 'none';
            inputImprove.focus();
        });

        getRidOfButton.addEventListener('click', function() {
            inputContainer.style.display = 'block';
            inputGetRidOf.style.display = 'block';
            inputImprove.style.display = 'none';
            inputGetRidOf.focus();
        });
    </script>
</body>
</html>
