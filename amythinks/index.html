<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self Help Page</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }

        img {
            max-width: 100%;
            height: auto;
            margin-bottom: 20px;
        }

        .question {
            font-size: 24px;
            margin: 20px;
            white-space: nowrap;
            overflow: hidden;
            border-right: 4px solid;
            animation: typing 3s steps(30, end), blink-caret 0.75s step-end infinite;
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes blink-caret {
            from, to { border-color: transparent; }
            50% { border-color: black; }
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s;
        }

        .btnImprove {
            background-color: #FFD700; /* Golden chrome color */
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .btnGetRidOf {
            background-color: #C0C0C0; /* Silver chrome color */
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .btn:hover {
            transform: translateY(2px);
        }

        .input-container {
            display: none;
            margin-top: 20px;
        }

        .input {
            padding: 10px;
            border-radius: 20px;
            border: 2px solid transparent;
            font-size: 18px;
            width: 300px;
        }

        .inputImprove {
            border-color: #FFD700; /* Gold border */
        }

        .inputGetRidOf {
            border-color: #C0C0C0; /* Silver border */
        }

        @media (max-width: 600px) {
            .question {
                font-size: 20px;
            }

            .btn {
                font-size: 16px;
                padding: 8px 16px;
            }

            .input {
                width: 80%; /* Responsive width for mobile */
            }
        }
    </style>
</head>
<body>

    <img src="amythinks.jpeg" alt="Self Help Image">
    <div class="question">Hi, I am Amy. What do you want to "Improve/Get Rid Of"?</div>
    
    <div class="button-container">
        <button class="btn btnImprove">Improve</button>
        <button class="btn btnGetRidOf">Get Rid Of</button>
    </div>

    <div class="input-container">
        <input type="text" class="input inputImprove" placeholder="What do you want to improve?">
        <input type="text" class="input inputGetRidOf" placeholder="What do you want to get rid of?">
    </div>

    <script>
        const improveButton = document.querySelector('.btnImprove');
        const getRidOfButton = document.querySelector('.btnGetRidOf');
        const inputContainer = document.querySelector('.input-container');
        const inputImprove = document.querySelector('.inputImprove');
        const inputGetRidOf = document.querySelector('.inputGetRidOf');

        improveButton.addEventListener('click', function() {
            inputContainer.style.display = 'block';
            inputImprove.style.display = 'block';
            inputGetRidOf.style.display = 'none';
            inputImprove.focus();
        });

        getRidOfButton.addEventListener('click', function() {
            inputContainer.style.display = 'block';
            inputGetRidOf.style.display = 'block';
            inputImprove.style.display = 'none';
            inputGetRidOf.focus();
        });
    </script>
</body>
</html>
